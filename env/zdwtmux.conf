set -g prefix C-x
unbind C-b

# split window
bind-key v split-window -h
bind-key h split-window -v

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
# bind -n S-Left previous-window
# bind -n S-Right next-window
bind -n C-PageDown  next-window
bind -n C-PageUp  previous-window


# bind m source-file /home/didi/Documents/env/tmux_car


# 2. 在复制模式下：按下 F2 直接执行 cancel 退出
# 这样无论你在做什么（搜索、选文中），按 F2 都会立即强制退出
bind-key -T copy-mode-vi F1 send-keys -X cancel
bind-key -T copy-mode    F1 send-keys -X cancel


# tmux 复制模式下通过 home end 来跳转到行首和行尾
bind-key -T copy-mode-vi Home send-keys -X start-of-line

# 跳转到行尾
bind-key -T copy-mode-vi End  send-keys -X end-of-line

# (可选) 兼容非 vi 模式下的 Home/End
bind-key -T copy-mode Home send-keys -X start-of-line
bind-key -T copy-mode End  send-keys -X end-of-line


# # 进入复制模式后，通过ctrl+上下方向键可以滚动屏幕，而不是移动光标
# # 向上滚动 1 行
# bind-key -T copy-mode-vi C-Up send-keys -X scroll-up
# # 向下滚动一行 (scroll-down)
# bind-key -T copy-mode-vi C-Down send-keys -X scroll-down

# 向上滚动 3 行
bind-key -T copy-mode-vi C-Up send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up
# 向下滚动 3 行
bind-key -T copy-mode-vi C-Down send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down

# bind-key -n F1 copy-mode
bind-key -n F1 if-shell -F "#{active_copy_mode}" "send-keys -X cancel" "copy-mode"
bind-key -n F2 command-prompt -I "#W" "rename-window '%%'"

bind-key -n F4 copy-mode \; send-keys -X search-forward "error"
bind-key -n F3 copy-mode \; send-keys -X search-backward "error"

# f1 进vim,通过 /? 来使用vim的搜索模式, 通过 n/N 来切换选择
# bind-key -n C-f command-prompt -p "Search for:" "copy-mode ; send-keys -X search-backward '%%'"

set-window-option -g mode-keys vi


# ========== 系统自动识别 + 平台专属配置 ==========
# 1. 判断是否为 macOS（Darwin 是 macOS 的内核名称）
if-shell '[ $(uname) = Darwin ]' '
  set -g set-clipboard on
  # macOS 专属：使用 pbcopy（系统原生，无需额外安装）
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
'

# 2. 判断是否为 Linux
if-shell '[ $(uname) = Linux ]' '
  # Linux 专属：使用 xclip（需提前安装：sudo apt install xclip / yum install xclip）
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
'


bind -n C-k set-window-option synchronize-panes

# set-window-option -g window-status-current-bg blue

setw -g monitor-activity on
set -g visual-activity on

# bind d source-file /home/computer/Documents/tmux/dev
setw -g mode-keys vi
set -g mouse on
set-option -g mouse on
set-option -s set-clipboard on


# 颜色显示
# set-window-option -g window-status-current-style bg=blue,fg=white,bold
set-window-option -g window-status-current-style bg=blue,fg=black

set-option -g status-right "play"
